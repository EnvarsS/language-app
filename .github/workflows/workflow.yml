name: workflow.yml
on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
defaults:
  run:
    working-directory: backend/${{ matrix.service }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      - name: Build and Test
        run: mvn clean verify
